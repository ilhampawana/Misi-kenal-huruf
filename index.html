
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misi Kenal Huruf</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#fff1b8,#ffd6e7,#d8f4ff);
  color:#30345b;text-align:center;min-height:100vh;
  padding:16px;
}
.container{max-width:650px;margin:auto}
header{padding:10px}
h1{font-size:clamp(27px,6vw,42px);margin:8px 0;color:#7546bb}
.subtitle{font-size:17px}
.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:15px 0}
.stat{background:white;border-radius:18px;padding:12px 20px;font-weight:bold;box-shadow:0 4px 0 #e4d8f7}
.card{background:#ffffffed;border-radius:25px;padding:22px 16px;box-shadow:0 8px 25px #7861a126}
.instruction{font-size:19px;font-weight:bold}
.big-letter{font-size:clamp(90px,25vw,140px);font-weight:900;color:#ff6495;margin:8px}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px auto;max-width:430px}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
.choice{border:0;border-radius:18px;background:#e7e0ff;color:#553a96;font-size:clamp(30px,8vw,42px);font-weight:bold;min-height:78px;box-shadow:0 5px 0 #c9b9ef}
.choice:active{transform:translateY(3px);box-shadow:0 2px 0 #c9b9ef}
.choice:disabled{cursor:default;opacity:.9}
.main-btn{border:0;border-radius:25px;padding:13px 20px;margin:5px;font-size:16px;font-weight:bold;background:#6bcbaf;color:#173f36}
.sound-btn{background:#d9efff;color:#245b85}
.reset-btn{background:#ffe2a6;color:#79500b}
.feedback{min-height:34px;font-size:19px;font-weight:bold;margin:12px 0}
.progress-wrap{height:12px;background:#eee5ff;border-radius:20px;overflow:hidden;margin:18px 0 8px}
.progress{height:100%;width:0;background:#7cceaa;transition:width .3s}
.small{font-size:14px;color:#696781;line-height:1.5}
footer{padding:20px 5px}
button:focus-visible{outline:3px solid #7546bb;outline-offset:3px}
@media(max-width:380px){
 body{padding:9px}.card{padding:16px 10px}
 .choices{gap:9px}.choice{min-height:68px}
 .stat{padding:10px 14px}
}

/* Animasi beruang melompat */
@keyframes bearJump {
  0%, 100% { transform: translateY(0) scale(1); }
  35% { transform: translateY(-35px) scale(1.1); }
  60% { transform: translateY(0) scale(0.95); }
  80% { transform: translateY(-12px) scale(1.03); }
}
.bear-jump {
  animation: bearJump 0.7s ease;
}

/* Animasi ganjaran bintang */
@keyframes starReward {
  0% {
    transform: scale(0.3) rotate(-30deg);
    opacity: 0;
  }
  60% {
    transform: scale(1.4) rotate(15deg);
    opacity: 1;
  }
  100% {
    transform: scale(1) rotate(0deg);
    opacity: 1;
  }
}

.star-reward {
  display: inline-block;
  animation: starReward 0.7s ease-out;
}

/* Skrin kemenangan Misi Kenal Huruf */
.victory-box {
  background: linear-gradient(135deg, #fff0a8, #ffd6ed, #c9f4ff);
  border: 4px solid #ffffff;
  border-radius: 24px;
  padding: 24px 16px;
  margin: 16px auto;
  text-align: center;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
  animation: victoryPop 0.7s ease-out;
}

@keyframes victoryPop {
  0% {
    transform: scale(0.6);
    opacity: 0;
  }
  70% {
    transform: scale(1.06);
    opacity: 1;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}

.victory-stars {
  font-size: 36px;
  letter-spacing: 5px;
  animation: starReward 1s ease-out;
}

</style>
</head>
<body>
<div class="container">
<header>
  <div style="font-size:42px" aria-hidden="true">🦋 🌈 🐻</div>
  <h1>🎈 Misi Kenal Huruf 🎈</h1>
  <div class="subtitle">Jom belajar ABC sambil bermain!</div>
</header>

<div class="stats">
  <div class="stat">⭐ Markah: <span id="score">0</span></div>
  <div class="stat">🌟 Bintang: <span id="stars">0</span></div>
  <div class="stat">🎯 Soalan: <span id="round">1</span>/10</div>
</div>

<main class="card">
  
<div id="mascot" style="font-size:70px;margin:10px auto;">🐻</div>
<div id="mascotMessage" style="background:#fff0b8;border-radius:18px;padding:12px;margin:10px auto;font-size:18px;font-weight:bold;">
Hai kawan! Jom belajar huruf! 🌈
</div>

<div id="starReward" style="font-size:36px;min-height:44px;margin:8px auto;"></div>

  <div class="instruction" id="instruction">Cari huruf yang betul!</div>
  <div class="big-letter" id="target">A</div>
  <button class="main-btn sound-btn" id="hearBtn">🔊 Dengar huruf</button>

  <div class="choices" id="choices">
    <button class="choice">A</button>
    <button class="choice">B</button>
    <button class="choice">C</button>
  </div>

  <div class="feedback" id="feedback" aria-live="polite">Pilih jawapan kamu 😊</div>
  <div class="progress-wrap"><div class="progress" id="progress"></div></div>
  <div class="small">Jawapan betul mendapat 10 markah dan 1 bintang!</div>
  <div style="margin-top:15px">
    <button class="main-btn" id="nextBtn" hidden>Soalan seterusnya ➜</button>
    <button class="main-btn" id="restartBtn" hidden onclick="location.reload()">🔄 Main Semula</button>
    <button class="main-btn reset-btn" id="restartBtn">🔄 Main semula</button>
  </div>
</main>

<footer class="small">
  💖 Terus mencuba! Setiap huruf membawa kita kepada ilmu baharu.
</footer>
</div>

<script>
const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const $ = id => document.getElementById(id);

let score = 0;
let stars = 0;
let round = 1;
let target = "A";
let answered = false;
let finished = false;
let used = [];

function shuffle(items) {
  const a = [...items];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function speakLetter(letter) {
  if (!("speechSynthesis" in window)) {
    $("feedback").textContent =
      "Maaf, suara tidak disokong pada pelayar ini.";
    return;
  }
  window.speechSynthesis.cancel();
  const speech = new SpeechSynthesisUtterance(letter);
  speech.lang = "ms-MY";
  speech.rate = 0.75;
  window.speechSynthesis.speak(speech);
}

function updateStats() {
  $("score").textContent = score;
  $("stars").textContent = stars;
  $("round").textContent = Math.min(round, 10);
  $("progress").style.width = ((round - 1) / 10 * 100) + "%";
}

function newQuestion() {
  answered = false;
  $("feedback").textContent = "Pilih jawapan kamu 😊";
  $("nextBtn").hidden = true;
  $("hearBtn").disabled = false;
  $("instruction").textContent = "Cari huruf yang betul!";
  $("target").textContent = "?";

  if (used.length === 0) used = shuffle(alphabet);
  target = used.pop();
  $("target").textContent = target;

  let options = [target];
  while (options.length < 3) {
    const letter = alphabet[Math.floor(Math.random() * alphabet.length)];
    if (!options.includes(letter)) options.push(letter);
  }

  $("choices").replaceChildren();
  shuffle(options).forEach(letter => {
    const button = document.createElement("button");
    button.className = "choice";
    button.textContent = letter;
    button.setAttribute("aria-label", "Pilih huruf " + letter);
    button.addEventListener("click", () => checkAnswer(letter, button));
    $("choices").appendChild(button);
  });
  updateStats();
}


function mascotSay(message, emoji) {
  document.getElementById("mascot").textContent = emoji;
  document.getElementById("mascotMessage").textContent = message;
}
async function playSound(correct) {
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return;

  const audio = new AudioContextClass();

  if (audio.state === "suspended") {
    await audio.resume();
  }

  const oscillator = audio.createOscillator();
  const gain = audio.createGain();

  oscillator.connect(gain);
  gain.connect(audio.destination);

  oscillator.type = "sine";
  oscillator.frequency.value = correct ? 880 : 220;

  gain.gain.setValueAtTime(0.12, audio.currentTime);
  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audio.currentTime + 0.3
  );

  oscillator.start();
  oscillator.stop(audio.currentTime + 0.3);

  oscillator.onended = () => audio.close();
}
  function checkAnswer(letter, button) {
  if (answered || finished) return;
  answered = true;

  document.querySelectorAll(".choice").forEach(b => b.disabled = true);

  if (letter === target) {
    score += 10;
    playSound(true);
    stars += 1;
    button.style.background = "#baf2d7";
    button.style.color = "#185c42";
    
    mascotSay("Hebat! Kamu memang bijak!", "🐻🎉");

    $("feedback").textContent = "Hebat! Betul! 🎉 +10 markah";
 const bear = document.getElementById("mascot");
bear.classList.remove("bear-jump");
void bear.offsetWidth;
bear.classList.add("bear-jump");
  
const reward = document.getElementById("starReward");

reward.innerHTML = '<span class="star-reward">⭐ +1 BINTANG!</span>';  
    speakLetter(target);
   } else {
    playSound(false);
    alert("Bahagian jawapan salah berjaya!");
    button.style.background = "#ffd4dd";
    button.style.color = "#8d2948";
    $("feedback").textContent = "Bagus mencuba! Jawapan ialah " + target + ". 💪";
    mascotSay("Tak mengapa, cuba lagi!", "🐻💪");
  } 

  $("hearBtn").disabled = false;
  $("nextBtn").hidden = false;
  $("nextBtn").textContent = round === 10 ? "Lihat keputusan 🏆" : "Soalan seterusnya ➜";
  $("progress").style.width = (round / 10 * 100) + "%";
  updateStats();
}

function nextQuestion() {
  if (!answered || finished) return;

  
  if (round >= 10) {
    finished = true;
    $("instruction").textContent = "Misi selesai!";

    mascotSay("Tahniah! Kamu juara! Hebat sekali!", "🐻🏆");

    $("target").textContent = "🏆";
    $("choices").replaceChildren();

    $("feedback").innerHTML =
      '<div class="victory-box">' +
      '<div class="victory-stars">⭐⭐⭐</div>' +
      '<h2>TAHNIAH, JUARA!</h2>' +
      '<p>Kamu berjaya menyelesaikan 10 soalan!</p>' +
      '<h2>' + score + ' / 100 MARKAH</h2>' +
      '<p>Kamu memperoleh ' + stars + ' bintang! 🌟</p>' +
      '<div class="victory-stars">🎉 🏆 🎉</div>' +
      '</div>';

    $("hearBtn").disabled = true;
    $("nextBtn").hidden = true;
    $("restartBtn").hidden = false;
    $("progress").style.width = "100%";
    return;
  }


  round++;
  newQuestion();
}

function restartGame() {
  score = 0;
  stars = 0;
  round = 1;
  finished = false;
  used = shuffle(alphabet);
  newQuestion();
}

$("hearBtn").addEventListener("click", () => speakLetter(target));
$("nextBtn").addEventListener("click", nextQuestion);
$("restartBtn").addEventListener("click", restartGame);

restartGame();
</script>
</body>
</html>
