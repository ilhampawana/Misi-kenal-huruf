
<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Misi Kenal Huruf!</title>
<style>
:root{--ink:#17365d;--green:#2e9d68;--yellow:#ffe58a;--pink:#ff7e9d;--blue:#79d8f4}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(#8de5ff,#eafcff 48%,#c8f0b1);min-height:100vh;padding:16px;display:grid;place-items:center}
.game{width:min(760px,100%);background:#ffffffed;border:5px solid white;border-radius:28px;box-shadow:0 12px 35px #24527b2b;overflow:hidden}.banner{background:linear-gradient(120deg,#42c7ee,#a0edff);padding:20px;text-align:center;position:relative}.banner h1{margin:0;font-size:clamp(1.7rem,5vw,2.7rem);color:#ef4f5e;text-shadow:2px 3px white}.banner p{margin:5px 0 0;font-weight:700}.content{padding:clamp(16px,4vw,28px)}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px;font-weight:800}.pill{background:#fff1b9;border-radius:999px;padding:8px 13px}.question{background:#fff0c6;border:2px solid #ffd86b;border-radius:18px;padding:16px;text-align:center;font-size:clamp(1.1rem,3.5vw,1.5rem);font-weight:850}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}.choice{background:white;border:3px solid #b8e9fa;border-radius:20px;padding:12px 6px;min-height:125px;font:inherit;font-weight:800;color:var(--ink);cursor:pointer;box-shadow:0 4px 0 #a8d9e8;transition:transform .12s,border-color .12s}.choice:active{transform:translateY(3px);box-shadow:none}.emoji{display:block;font-size:clamp(2.2rem,8vw,4rem);margin-bottom:5px}.choice.correct{border-color:#42b978;background:#e4ffed}.choice.wrong{border-color:#ff8290;background:#fff0f1}.feedback{min-height:50px;text-align:center;font-size:1.15rem;font-weight:850;padding:8px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.mainbtn{border:0;border-radius:999px;background:#635bdf;color:white;font-size:1rem;font-weight:850;padding:13px 22px;cursor:pointer;box-shadow:0 4px 0 #4239a7}.mainbtn:disabled{opacity:.45;cursor:default}.hidden{display:none}.start{text-align:center;padding:10px 0}.start .hero{font-size:5rem}.start p{font-size:1.1rem;line-height:1.5}.small{font-size:.86rem;color:#48647e;text-align:center;margin-top:18px}.stars{color:#e8a600;font-size:1.25rem}@media(max-width:430px){body{padding:8px}.choices{gap:7px}.choice{min-height:110px;font-size:.9rem}.content{padding:14px}.banner{padding:17px 10px}}
</style></head>
<body><main class="game" aria-live="polite"><header class="banner"><h1>🌟 Misi Kenal Huruf! 🌟</h1><p>Jom belajar sambil bermain</p></header><section class="content" id="start"><div class="start"><div class="hero">🦁 🔤 🐥</div><h2>Hai, kawan kecil!</h2><p>Bantu kita kenal huruf A, B dan C.<br>Pilih gambar yang betul dan kumpul bintang!</p><button class="mainbtn" id="startBtn">MULA BERMAIN ▶</button></div></section><section class="content hidden" id="play"><div class="top"><span class="pill" id="round">Soalan 1 daripada 3</span><span class="pill">⭐ <span id="score">0</span>/3</span></div><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback" role="status"></div><div class="actions"><button class="mainbtn hidden" id="nextBtn">Seterusnya ➜</button></div><p class="small">Dibuat untuk latihan awal kanak-kanak · Versi demo percuma</p></section><section class="content hidden" id="end"><div class="start"><div class="hero">🏆</div><h2>Hebat sekali!</h2><p id="result"></p><button class="mainbtn" id="againBtn">Main lagi ↻</button></div></section></main>
<script>
const qs=[
 {letter:'A',prompt:'Mana satu bermula dengan huruf A?',answers:[{name:'Ayam',emoji:'🐔',ok:true},{name:'Bola',emoji:'⚽',ok:false},{name:'Epal',emoji:'🍎',ok:false}]},
 {letter:'B',prompt:'Mana satu bermula dengan huruf B?',answers:[{name:'Kucing',emoji:'🐱',ok:false},{name:'Bola',emoji:'⚽',ok:true},{name:'Ayam',emoji:'🐔',ok:false}]},
 {letter:'C',prompt:'Mana satu bermula dengan huruf C?',answers:[{name:'Epal',emoji:'🍎',ok:false},{name:'Bola',emoji:'⚽',ok:false},{name:'Cawan',emoji:'☕',ok:true}]}
];
let index=0,score=0,answered=false;
const $=id=>document.getElementById(id);function show(id){['start','play','end'].forEach(s=>$(s).classList.toggle('hidden',s!==id))}
function start(){index=0;score=0;render();show('play')}
function render(){answered=false;const q=qs[index];$('round').textContent=`Soalan ${index+1} daripada ${qs.length}`;$('score').textContent=score;$('question').textContent=`Huruf ${q.letter}: ${q.prompt}`;$('feedback').textContent='Pilih satu jawapan!';$('nextBtn').classList.add('hidden');$('choices').innerHTML='';q.answers.forEach(a=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`<span class="emoji">${a.emoji}</span>${a.name}`;b.onclick=()=>answer(b,a.ok);$('choices').appendChild(b)})}
function answer(btn,ok){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach(b=>b.disabled=true);btn.classList.add(ok?'correct':'wrong');if(ok){score++;$('feedback').textContent='🌟 Bagus! Jawapan betul!';}else{$('feedback').textContent='💛 Cuba lagi lain kali! Jawapan yang betul ditandakan hijau.';const q=qs[index];[...document.querySelectorAll('.choice')].forEach((b,i)=>{if(q.answers[i].ok)b.classList.add('correct')})}$('score').textContent=score;$('nextBtn').textContent=index===qs.length-1?'Lihat keputusan 🏆':'Seterusnya ➜';$('nextBtn').classList.remove('hidden')}
$('startBtn').onclick=start;$('nextBtn').onclick=()=>{if(index<qs.length-1){index++;render()}else{show('end');$('result').textContent=`Adik dapat ${score} daripada ${qs.length} bintang. ${score===3?'Memang hebat!':'Terus berlatih, adik pasti boleh!'}`}};$('againBtn').onclick=start;
</script></body></html>
